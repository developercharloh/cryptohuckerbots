<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#020712" stop-opacity=".96"/>
      <stop offset=".42" stop-color="#031126" stop-opacity=".66"/>
      <stop offset="1" stop-color="#020712" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1a5"/>
      <stop offset=".38" stop-color="#ffd35a"/>
      <stop offset="1" stop-color="#e99a18"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8eeaff"/>
      <stop offset=".45" stop-color="#29b8ff"/>
      <stop offset="1" stop-color="#6e4cff"/>
    </linearGradient>
    <filter id="glowGold" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBlue" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="posterClip"><rect width="1080" height="1350" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#posterClip)">
    <image href="vixus_exchange_poster_bg.png" x="0" y="0" width="1080" height="1350" preserveAspectRatio="xMidYMid slice"/>
    <rect width="1080" height="1350" fill="url(#shade)"/>
    <rect x="30" y="30" width="1020" height="1290" rx="18" fill="none" stroke="#6fdcff" stroke-opacity=".28"/>

    <g transform="translate(78 78)">
      <circle cx="43" cy="43" r="43" fill="#07152a" stroke="#39c6ff" stroke-opacity=".8"/>
      <circle cx="43" cy="43" r="36" fill="#020712" stroke="#ffd35a" stroke-opacity=".55"/>
      <image href="/home/runner/workspace/artifacts/user-app/public/icons/vixus-ai-192.png" x="9" y="9" width="68" height="68" preserveAspectRatio="xMidYMid slice"/>
      <text x="105" y="39" fill="#f9fbff" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="4">VIXUS</text>
      <text x="107" y="69" fill="#9bc5dd" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3">EXCHANGE</text>
    </g>

    <g transform="translate(80 248)">
      <rect x="0" y="0" width="304" height="38" rx="19" fill="#09233b" fill-opacity=".82" stroke="#2cc9ff" stroke-opacity=".58"/>
      <circle cx="22" cy="19" r="5" fill="#5effb8" filter="url(#glowBlue)"/>
      <text x="39" y="25" fill="#b7e9ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">AUTOMATED SIGNALS</text>
    </g>

    <text x="80" y="382" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="77" font-weight="800" letter-spacing="-2">TRADE WITH</text>
    <text x="80" y="466" fill="url(#gold)" font-family="DejaVu Sans, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-3" filter="url(#glowGold)">CLARITY.</text>
    <text x="84" y="530" fill="#d4e7f4" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="500">Your market edge, working around the clock.</text>

    <g transform="translate(80 632)">
      <rect width="470" height="1" fill="url(#blue)" opacity=".8"/>
      <text x="0" y="53" fill="#f7fbff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700">Smarter market awareness.</text>
      <text x="0" y="92" fill="#b6cde0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20">VIXUS monitors market activity and surfaces</text>
      <text x="0" y="124" fill="#b6cde0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20">data-led signals, so you can focus on the move.</text>
    </g>

    <g transform="translate(80 830)">
      <g>
        <rect width="262" height="92" rx="16" fill="#061a2e" fill-opacity=".86" stroke="#2cc9ff" stroke-opacity=".48"/>
        <circle cx="31" cy="31" r="9" fill="none" stroke="#6de5ff" stroke-width="2"/>
        <path d="M31 18v13l8 7" fill="none" stroke="#6de5ff" stroke-width="2" stroke-linecap="round"/>
        <text x="56" y="37" fill="#f7fbff" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700">24/7 MONITORING</text>
        <text x="56" y="64" fill="#86b3ca" font-family="DejaVu Sans, Arial, sans-serif" font-size="14">Stay in the loop</text>
      </g>
      <g transform="translate(282 0)">
        <rect width="262" height="92" rx="16" fill="#061a2e" fill-opacity=".86" stroke="#ffd35a" stroke-opacity=".5"/>
        <path d="M26 42l12-13 10 8 17-20" fill="none" stroke="#ffd35a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="67" cy="17" r="4" fill="#fff0a0" filter="url(#glowGold)"/>
        <text x="84" y="37" fill="#f7fbff" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700">DATA-LED</text>
        <text x="84" y="64" fill="#cbbd88" font-family="DejaVu Sans, Arial, sans-serif" font-size="14">Signals, simplified</text>
      </g>
      <g transform="translate(564 0)">
        <rect width="262" height="92" rx="16" fill="#061a2e" fill-opacity=".86" stroke="#806cff" stroke-opacity=".62"/>
        <path d="M28 47l12-14 11 8 13-20" fill="none" stroke="#ae9eff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="84" y="37" fill="#f7fbff" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700">FOCUSED</text>
        <text x="84" y="64" fill="#b8b1e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="14">Less noise. More focus.</text>
      </g>
    </g>

    <g transform="translate(80 1070)">
      <text x="0" y="0" fill="#a4c5d8" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="2">CURIOUS WHAT THE MARKET IS SAYING?</text>
      <rect x="0" y="31" width="440" height="66" rx="33" fill="url(#gold)"/>
      <text x="34" y="73" fill="#07111f" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="800">DISCOVER VIXUS EXCHANGE</text>
    </g>

    <text x="80" y="1286" fill="#7291a5" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">Signals are informational and involve risk. Trade responsibly. No guaranteed results.</text>
  </g>
</svg>