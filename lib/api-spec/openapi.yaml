components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    TechnicalErrorInput:
      type: object
      properties:
        source: { type: string, enum: [client, api, health] }
        event: { type: string }
        route: { type: string }
        message: { type: string }
        statusCode: { type: integer }
      required: [event]

    TechnicalIncident:
      type: object
      properties:
        id: { type: integer }
        fingerprint: { type: string }
        source: { type: string }
        event: { type: string }
        route: { type: string }
        message: { type: string }
        status: { type: string, enum: [active, resolved] }
        occurrences: { type: integer }
        lastStatusCode: { type: ["integer", "null"] }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        resolvedAt: { type: ["string", "null"], format: date-time }
        resolvedBy: { type: ["integer", "null"] }
      required: [id, fingerprint, source, event, route, message, status, occurrences, lastStatusCode, firstSeenAt, lastSeenAt, resolvedAt, resolvedBy]

    TechnicalHealthCheck:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        status: { type: string, enum: [healthy, warning, critical] }
        message: { type: string }
      required: [key, label, status, message]

    TechnicalHealthResponse:
      type: object
      properties:
        checkedAt: { type: string, format: date-time }
        status: { type: string, enum: [healthy, warning, critical] }
        activeCount: { type: integer }
        criticalCount: { type: integer }
        checks:
          type: array
          items: { $ref: "#/components/schemas/TechnicalHealthCheck" }
        incidents:
          type: array
          items: { $ref: "#/components/schemas/TechnicalIncident" }
      required: [checkedAt, status, activeCount, criticalCount, checks, incidents]

    MarketNewsResponse:
      type: object
      properties:
        articles:
          type: array
          items:
            $ref: "#/components/schemas/MarketNewsArticle"
        updatedAt:
          type: string
      required: [articles, updatedAt]

    MarketNewsArticle:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        url:
          type: string
        source:
          type: string
        category:
          type: string
          enum: [markets, forex, stocks, commodities, crypto]
        publishedAt:
          type: string
      required: [id, title, summary, url, source, category, publishedAt]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    # Trade
    TradeSignal:
      type: object
      properties:
        id:
          type: string
        pair:
          type: string
        direction:
          type: string
        market:
          type: string
        confidence:
          type: number
        timeframe:
          type: string
        suggestedTp:
          type: number
        suggestedSl:
          type: number
        opportunityId:
          type: integer
        scheduledAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
        timezone:
          type: string
        vipLevel:
          type: integer
        dailyLimit:
          type: integer
        usedToday:
          type: integer
        remainingToday:
          type: integer
        signalAmount:
          type: number
        signalTrialActive:
          type: boolean
        signalTrialExpired:
          type: boolean
        signalTrialStartedAt:
          type: string
          format: date-time
          nullable: true
        signalTrialEndsAt:
          type: string
          format: date-time
          nullable: true
        signalTrialRemainingMs:
          type: integer
          minimum: 0
        signalAccessStartedAt:
          type: string
          format: date-time
          nullable: true
        signalPairsRemaining:
          type: integer
          nullable: true
        signalPairAllowance:
          type: integer
        vip2Required:
          type: boolean
      required: [id, opportunityId, pair, direction, market, confidence, timeframe, suggestedTp, suggestedSl, scheduledAt, expiresAt, status, timezone, vipLevel, dailyLimit, usedToday, remainingToday, signalTrialActive, signalTrialExpired, signalTrialStartedAt, signalTrialEndsAt, signalTrialRemainingMs, signalAccessStartedAt, signalPairsRemaining, signalPairAllowance, vip2Required]

    TradeAccess:
      type: object
      properties:
        vipLevel:
          type: integer
        minimumDeposit:
          type: number
        totalDeposited:
          type: number
        hasPackage:
          type: boolean
        packagePrice:
          type: number
          nullable: true
        vaultCapital:
          type: number
        lockedInvestmentCapital:
          type: number
        canExecute:
          type: boolean
        dailyLimit:
          type: integer
        usedToday:
          type: integer
        remainingToday:
          type: integer
        qualifiedReferrals:
          type: integer
          minimum: 0
        totalWithdrawn:
          type: number
          minimum: 0
        withdrawalSignalThreshold:
          type: number
          minimum: 0
        withdrawalReferralRequirement:
          type: integer
          minimum: 0
        withdrawalGateActive:
          type: boolean
        nextLevelReferralRequirement:
          type: integer
          minimum: 0
          nullable: true
        nextLevel:
          type: integer
          nullable: true
        nextLevelDeposit:
          type: number
          nullable: true
        nextLevelAmountDue:
          type: number
          nullable: true
        signalTrialActive:
          type: boolean
        signalTrialExpired:
          type: boolean
        signalTrialStartedAt:
          type: string
          format: date-time
          nullable: true
        signalTrialEndsAt:
          type: string
          format: date-time
          nullable: true
        signalTrialRemainingMs:
          type: integer
          minimum: 0
        signalAccessStartedAt:
          type: string
          format: date-time
          nullable: true
        signalPairsRemaining:
          type: integer
          nullable: true
        signalPairAllowance:
          type: integer
        vip2Required:
          type: boolean
        timezone:
          type: string
        nextSignalAt:
          type: string
          format: date-time
          nullable: true
        signalAmount:
          type: number
        cooldownUntil:
          type: string
          format: date-time
          nullable: true
        cooldownActive:
          type: boolean
      required: [vipLevel, minimumDeposit, totalDeposited, hasPackage, packagePrice, vaultCapital, lockedInvestmentCapital, canExecute, dailyLimit, usedToday, remainingToday, qualifiedReferrals, totalWithdrawn, withdrawalSignalThreshold, withdrawalReferralRequirement, withdrawalGateActive, timezone, nextLevelReferralRequirement, nextLevel, nextLevelDeposit, nextLevelAmountDue, signalTrialActive, signalTrialExpired, signalTrialStartedAt, signalTrialEndsAt, signalTrialRemainingMs, signalAccessStartedAt, signalPairsRemaining, signalPairAllowance, vip2Required, nextSignalAt, signalAmount, cooldownUntil, cooldownActive]

    VipPackage:
      type: object
      properties:
        level:
          type: integer
        price:
          type: number
        dailySignals:
          type: integer
        referralRequirement:
          type: integer
          minimum: 0
        isActive:
          type: boolean
        isUpgrade:
          type: boolean
        isAvailable:
          type: boolean
        amountDue:
          type: number
      required: [level, price, dailySignals, referralRequirement, isActive, isUpgrade, isAvailable, amountDue]

    VipPackagePurchaseResponse:
      type: object
      properties:
        message:
          type: string
        package:
          type: object
          properties:
            level:
              type: integer
            price:
              type: number
            dailySignals:
              type: integer
            purchasedAt:
              type: string
              format: date-time
          required: [level, price, dailySignals, purchasedAt]
        lockedInvestmentCapital:
          type: number
        vaultCapital:
          type: number
        portfolioBalance:
          type: number
        amountPaid:
          type: number
        mainWalletBalance:
          type: number
      required: [message, package, amountPaid, vaultCapital, portfolioBalance, lockedInvestmentCapital, mainWalletBalance]

    ExecuteTradeInput:
      type: object
      properties:
        signalId:
          type: string
        botId:
          type: integer
          description: Legacy compatibility field; ignored for fixed-price signal execution.
        targetProfit:
          type: number
          description: Legacy compatibility field; ignored for fixed-price signal execution.
        stopLoss:
          type: number
          description: Legacy compatibility field; ignored for fixed-price signal execution.
        stake:
          type: number
          description: Legacy compatibility field; ignored for fixed-price signal execution.
        opportunityId:
          type: integer
        consent:
          type: boolean
        clientRequestId:
          type: string
      required: [signalId, opportunityId, consent]

    ExecuteAllTradeSignalsInput:
      type: object
      properties:
        consent:
          type: boolean
        clientRequestId:
          type: string
      required: [consent]

    BulkTradeExecutionSignal:
      type: object
      properties:
        id:
          type: string
